<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Plánek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f0dd">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plánek">

  <style>
    :root{
      --grid-margin:6px;
      --grid-border:3px;
      --grid-gap:1px;
      --board-max-width:600px;
      --board-width:min(100vw,var(--board-max-width));
      --cell-size:calc((var(--board-width) - 2*var(--grid-margin) - 2*var(--grid-border) - 12*var(--grid-gap))/12);
      --label-size:var(--cell-size);
      --border:#9a7b4f;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      margin:0;
      background:#d9c6a1;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-bottom:0;
      overflow:hidden;
      font-size:16px;
    }

    .wrapper{
      background:#f8f0dd;
      border:3px solid var(--border);
      box-shadow:0 5px 20px rgba(0,0,0,.3);
      width:100%;
      max-width:600px;
      margin:auto;
      height:100dvh;
      max-height:100dvh;
      display:flex;
      flex-direction:column;
    }

    .grid{
      margin:var(--grid-margin);
      display:grid;
      grid-template-columns:var(--label-size) repeat(11,var(--cell-size));
      grid-template-rows:var(--label-size) repeat(11,var(--cell-size));
      background:var(--border);
      gap:var(--grid-gap);
    }

    .label{
      background:#e0cda1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:0;
      font-size:14px;
      line-height:1;
      user-select:none;
      position:relative;
      min-width:0;
      min-height:0;
    }
    .label.editable-label{cursor:pointer}
    .label.editable-label:hover{filter:brightness(1.03)}
    .label-main{
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:1.55em;
      min-height:1.55em;
      padding:1px 3px;
      border:2px solid transparent;
      border-radius:50%;
      font-weight:600;
      line-height:1;
    }
    .label.circle .label-main{border-color:#111827}
    .label.underline .label-main{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
    .label.bold .label-main{font-weight:900}
    .label-note{
      display:block;
      width:100%;
      max-width:100%;
      padding:0 2px;
      margin-top:-1px;
      font-size:clamp(6px,1.5vw,8px);
      line-height:1;
      font-weight:500;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:#1f2937;
    }

    .cell{
      background:#fffaf0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.1em;
      font-weight:bold;
      cursor:pointer;
      user-select:none;
      color:#000;
      position:relative;
    }
    .cell.selected{outline:3px solid #2563eb;outline-offset:-2px}
    .cell.blocked{background:#000;cursor:not-allowed}
    .cell.blocked.selected{outline:none}

    .controls{
      margin:4px var(--grid-margin) 4px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      font-size:14px;
    }
    .controls button,.controls select{
      padding:8px 12px;
      background:#f3e2bd;
      border:1px solid var(--border);
      cursor:pointer;
      font-weight:bold;
      border-radius:6px;
      font-size:14px;
      min-width:110px;
    }
    .controls button:hover,.controls select:hover{background:#f7e8c9}

    .palette{
      margin:0 var(--grid-margin) 4px;
      display:flex;
      gap:4px;
      flex-wrap:nowrap;
      justify-content:flex-start;
    }
    .colorBtn{
      width:40px;
      height:40px;
      border-radius:3px;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:20px;
      cursor:pointer;
      user-select:none;
      color:#000;
    }

    .coins-row{
      margin:4px var(--grid-margin) 4px;
      display:flex;
      gap:4px;
      flex-wrap:nowrap;
      justify-content:flex-start;
    }
    .coin{
      width:28px;
      height:28px;
      border-radius:50%;
      background:#eab308;
      border:2px solid transparent;
      box-shadow:0 0 0 1px #9a7b4f55 inset;
      cursor:pointer;
    }

    .scores-wrapper{
      margin:4px var(--grid-margin) 8px;
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
      font-size:14px;
    }
    .score-table{
      border:2px solid #6b4b25;
      border-radius:4px;
      background:#f8f0dd;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(2,1fr);
      min-width:90px;
      max-width:110px;
      min-height:48px;
      overflow:hidden;
      font-size:12px;
    }
    .score-cell{
      border:1px solid #d0b88b;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2px;
      box-sizing:border-box;
    }
    .score-cell.header{font-weight:bold;background:#f1dfbe}
    .score-cell.sum{grid-row:1/3;font-weight:bold;background:#f4e7ca}
    .score-cell.value{background:#fffaf0}
    .score-cell.editable{cursor:pointer}
    .score-cell.value.specialN{background:#a855f7;color:#fff;font-size:1.1em}
    .score-coin{
      width:14px;
      height:14px;
      border-radius:50%;
      background:#eab308;
      box-shadow:0 0 0 1px #9a7b4f55 inset;
    }
    .plus-sign{font-weight:bold;font-size:16px;padding:0 2px}
    .total-box{
      border:2px solid #6b4b25;
      border-radius:4px;
      min-width:60px;
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f4e7ca;
      font-weight:bold;
      font-size:16px;
    }
    .score-cell input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      text-align:center;
      font:inherit;
    }

    .label-menu{
      position:fixed;
      z-index:1000;
      width:min(270px,calc(100vw - 16px));
      padding:10px;
      border:2px solid #6b4b25;
      border-radius:10px;
      background:#fffaf0;
      box-shadow:0 8px 24px rgba(0,0,0,.28);
      display:none;
    }
    .label-menu.open{display:block}
    .label-menu-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
      font-size:13px;
      font-weight:800;
    }
    .label-menu-close{
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:20px;
      line-height:1;
      width:28px;
      height:28px;
      border-radius:6px;
    }
    .label-menu-close:hover{background:#f3e2bd}
    .label-actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      margin-bottom:8px;
    }
    .label-action{
      padding:7px 5px;
      border:1px solid #b79a6b;
      background:#f8edda;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
    }
    .label-action.active{outline:2px solid #2563eb;outline-offset:-2px;background:#e8f0ff}
    .label-color-row{
      display:flex;
      align-items:center;
      gap:7px;
      margin-bottom:8px;
      font-size:12px;
      font-weight:700;
    }
    .label-color{
      width:28px;
      height:28px;
      border-radius:50%;
      border:2px solid #ffffff;
      box-shadow:0 0 0 1px #7c6648;
      cursor:pointer;
    }
    .label-color.active{box-shadow:0 0 0 3px #2563eb}
    .label-color.none{background:linear-gradient(135deg,#e0cda1 46%,#991b1b 47%,#991b1b 53%,#e0cda1 54%)}
    .label-note-row{display:flex;gap:6px;align-items:center}
    .label-note-input{
      flex:1;
      min-width:0;
      padding:7px 8px;
      border:1px solid #b79a6b;
      border-radius:6px;
      background:#fff;
      font-size:13px;
    }
    .label-note-clear{
      padding:7px 9px;
      border:1px solid #b91c1c;
      border-radius:6px;
      background:#fee2e2;
      color:#991b1b;
      font-weight:800;
      cursor:pointer;
    }
    .label-note-clear:hover{background:#fecaca}

    @media(max-width:600px){.scores-wrapper{flex-wrap:wrap}}
  </style>
</head>
<body>

<div class="wrapper">
  <div id="grid" class="grid"></div>

  <div class="controls">
    <select id="mapSelect" aria-label="Výběr mapy">
      <option value="1">Mapa 1</option>
      <option value="2">Mapa 2</option>
    </select>
    <button id="eraseBtn">Smazat políčko</button>
    <button id="clearSelBtn">Zrušit výběr</button>
    <button id="clearAllBtn">Smazat mapu</button>
  </div>

  <div class="palette">
    <div class="colorBtn" data-letter="L" style="background:#22c55e;">🌳</div>
    <div class="colorBtn" data-letter="D" style="background:#ef4444;">🏠</div>
    <div class="colorBtn" data-letter="V" style="background:#3b82f6;">🌊</div>
    <div class="colorBtn" data-letter="P" style="background:#eab308;">🌾</div>
    <div class="colorBtn" data-letter="H" style="background:#6b7280;color:#fff;">⚔️</div>
    <div class="colorBtn" data-letter="N" style="background:#a855f7;color:#fff;">😈</div>
    <div class="colorBtn" data-letter="X" style="background:#000;color:#fff;">X</div>
    <div class="colorBtn" data-letter="A" style="background:#8B4513;color:#fff;">⛰️</div>
    <div class="colorBtn" data-letter="*" style="background:#fffaf0;">*</div>
  </div>

  <div class="coins-row" id="coinsRow"></div>

  <div class="scores-wrapper">
    <div class="score-table" data-table="0">
      <div class="score-cell header editable" data-table="0" data-slot="1">A</div>
      <div class="score-cell header editable" data-table="0" data-slot="2">B</div>
      <div class="score-cell sum" data-role="sum">0</div>
      <div class="score-cell value editable" data-table="0" data-slot="3"><div class="score-coin"></div></div>
      <div class="score-cell value editable specialN" data-table="0" data-slot="4">😈</div>
    </div>
    <div class="plus-sign">+</div>
    <div class="score-table" data-table="1">
      <div class="score-cell header editable" data-table="1" data-slot="1">B</div>
      <div class="score-cell header editable" data-table="1" data-slot="2">C</div>
      <div class="score-cell sum" data-role="sum">0</div>
      <div class="score-cell value editable" data-table="1" data-slot="3"><div class="score-coin"></div></div>
      <div class="score-cell value editable specialN" data-table="1" data-slot="4">😈</div>
    </div>
    <div class="plus-sign">+</div>
    <div class="score-table" data-table="2">
      <div class="score-cell header editable" data-table="2" data-slot="1">C</div>
      <div class="score-cell header editable" data-table="2" data-slot="2">D</div>
      <div class="score-cell sum" data-role="sum">0</div>
      <div class="score-cell value editable" data-table="2" data-slot="3"><div class="score-coin"></div></div>
      <div class="score-cell value editable specialN" data-table="2" data-slot="4">😈</div>
    </div>
    <div class="plus-sign">+</div>
    <div class="score-table" data-table="3">
      <div class="score-cell header editable" data-table="3" data-slot="1">D</div>
      <div class="score-cell header editable" data-table="3" data-slot="2">A</div>
      <div class="score-cell sum" data-role="sum">0</div>
      <div class="score-cell value editable" data-table="3" data-slot="3"><div class="score-coin"></div></div>
      <div class="score-cell value editable specialN" data-table="3" data-slot="4">😈</div>
    </div>
    <div class="plus-sign">=</div>
    <div class="total-box" id="totalScore">0</div>
  </div>
</div>

<div id="labelMenu" class="label-menu" role="dialog" aria-label="Označení řádku nebo sloupce">
  <div class="label-menu-title">
    <span id="labelMenuTitle">Označení</span>
    <button id="labelMenuClose" class="label-menu-close" type="button" aria-label="Zavřít">×</button>
  </div>
  <div class="label-actions">
    <button class="label-action" data-action="circle" type="button">◯ Kroužek</button>
    <button class="label-action" data-action="underline" type="button"><u>Podtržení</u></button>
    <button class="label-action" data-action="bold" type="button"><strong>Tučné</strong></button>
  </div>
  <div class="label-color-row">
    <span>Pozadí:</span>
    <button class="label-color none" data-bg="" type="button" title="Bez barvy" aria-label="Bez barvy"></button>
    <button class="label-color" data-bg="#86efac" type="button" title="Zelená" aria-label="Zelená" style="background:#86efac"></button>
    <button class="label-color" data-bg="#93c5fd" type="button" title="Modrá" aria-label="Modrá" style="background:#93c5fd"></button>
    <button class="label-color" data-bg="#fca5a5" type="button" title="Červená" aria-label="Červená" style="background:#fca5a5"></button>
  </div>
  <div class="label-note-row">
    <input id="labelNoteInput" class="label-note-input" type="text" maxlength="24" placeholder="Poznámka pod označením">
    <button id="labelNoteClear" class="label-note-clear" type="button">Smazat</button>
  </div>
</div>

<script>
const letterColors={L:'#22c55e',D:'#ef4444',V:'#3b82f6',P:'#eab308',H:'#6b7280',N:'#a855f7',X:'#000000',A:'#8B4513'};
const ROWS=11;
const COLS=11;
const MAPS={
  '1':{mountains:['B2','F4','J6','D9','I10'],blocked:[]},
  '2':{mountains:['D4','I3','F7','I10','B10'],blocked:['B2','C2','J1','J2','G10','F10','F11']}
};
let currentMap='1';
const gridEl=document.getElementById('grid');

function getSymbol(letter){
  switch(letter){
    case'D':return'🏠';case'V':return'🌊';case'P':return'🌾';case'L':return'🌳';case'N':return'😈';case'H':return'⚔️';case'A':return'⛰️';default:return letter;
  }
}

function addLabel(text,type,key){
  const lbl=document.createElement('div');
  lbl.className='label';
  if(text!==''){
    lbl.classList.add('editable-label');
    lbl.dataset.labelType=type;
    lbl.dataset.labelKey=key;
    const main=document.createElement('span');
    main.className='label-main';
    main.textContent=text;
    const note=document.createElement('span');
    note.className='label-note';
    lbl.append(main,note);
    lbl.addEventListener('click',e=>{e.stopPropagation();openLabelMenu(lbl)});
  }
  gridEl.appendChild(lbl);
}

function createGrid(){
  addLabel('','','');
  for(let c=1;c<=COLS;c++)addLabel(String(c),'col',String(c));
  for(let r=0;r<ROWS;r++){
    const rowLetter=String.fromCharCode(65+r);
    addLabel(rowLetter,'row',rowLetter);
    for(let c=1;c<=COLS;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.row=r;
      cell.dataset.col=c;
      cell.dataset.coord=rowLetter+String(c);
      cell.addEventListener('click',()=>{if(cell.classList.contains('blocked'))return;cell.classList.toggle('selected')});
      gridEl.appendChild(cell);
    }
  }
}
createGrid();

const mapSelect=document.getElementById('mapSelect');
const eraseBtn=document.getElementById('eraseBtn');
const clearSelBtn=document.getElementById('clearSelBtn');
const clearAllBtn=document.getElementById('clearAllBtn');

function resetCell(cell){
  delete cell.dataset.letter;
  delete cell.dataset.blocked;
  cell.textContent='';
  cell.style.background='#fffaf0';
  cell.style.color='#000';
  cell.classList.remove('selected','blocked');
  cell.removeAttribute('title');
  cell.removeAttribute('aria-label');
}
function getCell(coord){return gridEl.querySelector('.cell[data-coord="'+coord+'"]')}
function loadMap(mapId){
  const preset=MAPS[mapId]||MAPS['1'];
  currentMap=MAPS[mapId]?mapId:'1';
  gridEl.querySelectorAll('.cell').forEach(resetCell);
  preset.mountains.forEach(coord=>{
    const cell=getCell(coord);if(!cell)return;
    cell.dataset.letter='A';
    cell.textContent=getSymbol('A');
    cell.style.background=letterColors.A;
    cell.style.color='#fff';
  });
  preset.blocked.forEach(coord=>{
    const cell=getCell(coord);if(!cell)return;
    delete cell.dataset.letter;
    cell.dataset.blocked='1';
    cell.textContent='';
    cell.style.background='#000';
    cell.style.color='#fff';
    cell.classList.add('blocked');
    cell.title='Propast – '+coord;
    cell.setAttribute('aria-label','Propast '+coord);
  });
  mapSelect.value=currentMap;
}
mapSelect.addEventListener('change',()=>loadMap(mapSelect.value));
loadMap(currentMap);

function applyLetter(letter){
  const selected=gridEl.querySelectorAll('.cell.selected:not(.blocked)');
  if(selected.length===0)return;
  if(letter==='*'){
    selected.forEach(cell=>{cell.dataset.letter='*';cell.textContent='*';cell.style.background='#fffaf0';cell.style.color='#000';cell.classList.remove('selected')});
    return;
  }
  const color=letterColors[letter];if(!color)return;
  const symbol=getSymbol(letter);
  selected.forEach(cell=>{
    cell.dataset.letter=letter;
    cell.textContent=symbol;
    cell.style.background=color;
    cell.style.color=(letter==='X'||letter==='H'||letter==='N'||letter==='A')?'#fff':'#000';
    cell.classList.remove('selected');
  });
}

document.querySelectorAll('.colorBtn').forEach(btn=>btn.addEventListener('click',()=>applyLetter(btn.dataset.letter)));
eraseBtn.onclick=()=>{
  gridEl.querySelectorAll('.cell.selected:not(.blocked)').forEach(cell=>{cell.dataset.letter='';cell.textContent='';cell.style.background='#fffaf0';cell.style.color='#000';cell.classList.remove('selected')});
};
clearSelBtn.onclick=()=>gridEl.querySelectorAll('.cell.selected').forEach(c=>c.classList.remove('selected'));

const labelMenu=document.getElementById('labelMenu');
const labelMenuTitle=document.getElementById('labelMenuTitle');
const labelMenuClose=document.getElementById('labelMenuClose');
const labelNoteInput=document.getElementById('labelNoteInput');
const labelNoteClear=document.getElementById('labelNoteClear');
let activeLabel=null;

function labelName(lbl){return lbl.dataset.labelType==='row'?'Řádek '+lbl.dataset.labelKey:'Sloupec '+lbl.dataset.labelKey}
function saveLabelNote(){
  if(!activeLabel)return;
  const note=labelNoteInput.value.trim();
  const noteEl=activeLabel.querySelector('.label-note');
  if(note){
    activeLabel.dataset.note=note;
    noteEl.textContent=note;
    activeLabel.title=labelName(activeLabel)+' – '+note;
  }else{
    delete activeLabel.dataset.note;
    noteEl.textContent='';
    activeLabel.removeAttribute('title');
  }
}
function resetLabel(lbl){
  if(!lbl)return;
  lbl.classList.remove('circle','underline','bold');
  delete lbl.dataset.bg;
  delete lbl.dataset.note;
  lbl.style.background='#e0cda1';
  const noteEl=lbl.querySelector('.label-note');
  if(noteEl)noteEl.textContent='';
  lbl.removeAttribute('title');
}
function clearAllLabels(){
  gridEl.querySelectorAll('.editable-label').forEach(resetLabel);
}
function updateLabelMenuState(){
  if(!activeLabel)return;
  document.querySelectorAll('.label-action').forEach(btn=>btn.classList.toggle('active',activeLabel.classList.contains(btn.dataset.action)));
  const currentBg=activeLabel.dataset.bg||'';
  document.querySelectorAll('.label-color').forEach(btn=>btn.classList.toggle('active',(btn.dataset.bg||'')===currentBg));
  labelNoteInput.value=activeLabel.dataset.note||'';
}
function positionLabelMenu(lbl){
  const rect=lbl.getBoundingClientRect();
  labelMenu.classList.add('open');
  const menuRect=labelMenu.getBoundingClientRect();
  let left=rect.left+rect.width/2-menuRect.width/2;
  left=Math.max(8,Math.min(left,window.innerWidth-menuRect.width-8));
  let top=rect.bottom+6;
  if(top+menuRect.height>window.innerHeight-8)top=rect.top-menuRect.height-6;
  top=Math.max(8,top);
  labelMenu.style.left=Math.round(left)+'px';
  labelMenu.style.top=Math.round(top)+'px';
}
function openLabelMenu(lbl){
  if(activeLabel&&activeLabel!==lbl)saveLabelNote();
  activeLabel=lbl;
  labelMenuTitle.textContent=labelName(lbl);
  updateLabelMenuState();
  positionLabelMenu(lbl);
}
function closeLabelMenu(){
  saveLabelNote();
  labelMenu.classList.remove('open');
  activeLabel=null;
}
labelMenuClose.addEventListener('click',closeLabelMenu);

document.querySelectorAll('.label-action').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(!activeLabel)return;
    activeLabel.classList.toggle(btn.dataset.action);
    updateLabelMenuState();
  });
});

document.querySelectorAll('.label-color').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(!activeLabel)return;
    const bg=btn.dataset.bg||'';
    if(bg){activeLabel.dataset.bg=bg;activeLabel.style.background=bg}
    else{delete activeLabel.dataset.bg;activeLabel.style.background='#e0cda1'}
    updateLabelMenuState();
  });
});

labelNoteInput.addEventListener('input',saveLabelNote);
labelNoteInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    saveLabelNote();
    labelNoteInput.blur();
  }
});
labelNoteClear.addEventListener('click',()=>{
  if(!activeLabel)return;
  const lbl=activeLabel;
  resetLabel(lbl);
  labelMenu.classList.remove('open');
  activeLabel=null;
});

document.addEventListener('click',e=>{
  if(!labelMenu.classList.contains('open'))return;
  if(labelMenu.contains(e.target))return;
  if(e.target.closest('.editable-label'))return;
  closeLabelMenu();
});
window.addEventListener('resize',()=>{if(activeLabel)positionLabelMenu(activeLabel)});

clearAllBtn.onclick=()=>{
  if(!confirm('Smazat celou mapu včetně poznámek a označení řádků a sloupců?'))return;
  loadMap(currentMap);
  clearAllLabels();
  labelMenu.classList.remove('open');
  activeLabel=null;
};

const coinsRow=document.getElementById('coinsRow');
for(let i=0;i<14;i++){
  const coin=document.createElement('div');
  coin.className='coin';
  coin.dataset.state='0';
  coin.addEventListener('click',()=>{
    let s=parseInt(coin.dataset.state||'0',10);
    s=(s+1)%3;
    coin.dataset.state=String(s);
    if(s===0){coin.style.background='#eab308';coin.style.borderColor='transparent'}
    else if(s===1){coin.style.background='#eab308';coin.style.borderColor='#2563eb'}
    else{coin.style.background='#9ca3af';coin.style.borderColor='transparent'}
  });
  coinsRow.appendChild(coin);
}

function recalcTable(tableIndex){
  const cells=document.querySelectorAll('.score-cell.editable[data-table="'+tableIndex+'"]');
  let sum=0;
  cells.forEach(c=>{const v=parseFloat(c.dataset.value);if(!isNaN(v))sum+=v});
  const sumCell=document.querySelector('.score-table[data-table="'+tableIndex+'"] .score-cell.sum');
  if(sumCell)sumCell.textContent=String(sum);
}
function recalcTotal(){
  let total=0;
  document.querySelectorAll('.score-cell.sum').forEach(c=>{const v=parseFloat(c.textContent.replace(',','.'));if(!isNaN(v))total+=v});
  document.getElementById('totalScore').textContent=String(total);
}
function startEdit(cell){
  if(cell.querySelector('input'))return;
  const tableIndex=cell.dataset.table;
  const current=(cell.dataset.value!==undefined)?cell.dataset.value:'';
  const prevBg=cell.style.backgroundColor;
  const prevColor=cell.style.color;
  cell.textContent='';
  const input=document.createElement('input');
  input.type='text';input.inputMode='decimal';input.value=current;
  cell.appendChild(input);input.focus();input.select();
  const finish=()=>{
    const valueStr=input.value.trim();
    if(!input.isConnected)return;
    cell.removeChild(input);
    if(valueStr===''){
      delete cell.dataset.value;
      cell.textContent='';
      cell.style.backgroundColor=prevBg||'';
      cell.style.color=prevColor||'';
    }else{
      let num=parseFloat(valueStr.replace(',','.'));
      if(isNaN(num)){cell.dataset.value='';cell.textContent=valueStr}
      else{
        if(cell.classList.contains('specialN'))num=-Math.abs(num);
        cell.dataset.value=String(num);
        cell.textContent=String(num).replace('.',',');
        cell.style.backgroundColor='#fffaf0';
        cell.style.color='#000';
      }
    }
    recalcTable(tableIndex);recalcTotal();
  };
  input.addEventListener('blur',finish);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur()}});
}
document.querySelectorAll('.score-cell.editable').forEach(cell=>cell.addEventListener('click',()=>startEdit(cell)));

(function(){
  const root=document.documentElement;
  const wrapper=document.querySelector('.wrapper');
  function viewportH(){return(window.visualViewport&&window.visualViewport.height)?window.visualViewport.height:window.innerHeight}
  function fitOnce(){
    if(!wrapper)return;
    const maxW=Math.min(600,Math.floor(window.innerWidth));
    let lo=240,hi=Math.max(lo,maxW),best=lo;
    root.style.setProperty('--board-max-width',hi+'px');
    void wrapper.offsetHeight;
    if(wrapper.scrollHeight<=viewportH())return;
    for(let i=0;i<14;i++){
      const mid=Math.floor((lo+hi)/2);
      root.style.setProperty('--board-max-width',mid+'px');
      void wrapper.offsetHeight;
      if(wrapper.scrollHeight<=viewportH()){best=mid;lo=mid+1}else hi=mid-1;
    }
    root.style.setProperty('--board-max-width',best+'px');
  }
  let t=null;
  function fitDebounced(){clearTimeout(t);t=setTimeout(fitOnce,60)}
  window.addEventListener('load',()=>requestAnimationFrame(()=>requestAnimationFrame(fitOnce)));
  window.addEventListener('resize',fitDebounced);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',fitDebounced);
})();

if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
</script>
